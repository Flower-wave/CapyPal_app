<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CapyPal — Profile</title>
  <style>
    :root {
      --orange: #f89b1d;
      --orange-deep: #da6c00;
      --cream: #fff8ec;
      --text: #111111;
      --muted: #7a6658;
      --mint: #84e5a1;
      --shadow: 0 18px 40px rgba(110, 69, 24, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 18px;
      background: #f7f2ea;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
    }

    .app-shell {
      width: 100%;
      max-width: 375px;
    }

    .app-frame {
      width: 375px;
      min-height: 812px;
      background:
        url('white_orange_pattern.jpg') center/cover no-repeat,
        #fffdf9;
      position: relative;
      overflow: hidden;
      border-radius: 30px;
      border: 4px solid var(--orange-deep);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
    }

    .top-bar,
    .bottom-bar {
      background: var(--orange);
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .top-bar {
      border-bottom: 4px solid var(--orange-deep);
      height: 190px;
      flex: 0 0 auto;
    }

    .home-link {
      display: grid;
      justify-items: center;
      gap: 12px;
      color: var(--text);
      text-decoration: none;
      font-weight: 900;
      font-size: 22px;
    }

    .home-link img {
      width: 88px;
      height: 88px;
      object-fit: cover;
      border-radius: 24px;
      background: #fff;
      padding: 6px;
      box-shadow: 0 12px 20px rgba(0, 0, 0, 0.08);
    }

    .content {
      padding: 18px 16px 24px;
      display: grid;
      gap: 18px;
      justify-items: center;
      flex: 1;
    }

    .profile-title {
      margin: 0;
      font-size: 64px;
      line-height: 0.9;
      letter-spacing: 0.02em;
      font-weight: 900;
      color: var(--orange);
      -webkit-text-stroke: 4px var(--orange-deep);
      paint-order: stroke fill;
      text-shadow:
        5px 5px 0 #fff,
        -5px -5px 0 #fff,
        5px -5px 0 #fff,
        -5px 5px 0 #fff;
      text-align: center;
    }

    .avatar-wrap {
      position: relative;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      overflow: hidden;
      background:
        linear-gradient(rgba(248, 155, 29, 0.36), rgba(248, 155, 29, 0.36)),
        url('account_circle.png') center/70% no-repeat,
        #f4dbc0;
      box-shadow: 0 14px 28px rgba(106, 69, 27, 0.12);
    }

    .camera-badge {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 54px;
      font-weight: 900;
      text-shadow: 0 6px 12px rgba(0, 0, 0, 0.18);
      pointer-events: none;
    }

    .settings-card {
      width: 100%;
      background: rgba(255, 247, 231, 0.98);
      border: 4px solid var(--orange-deep);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 14px 14px 12px;
    }

    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 8px 12px;
      min-height: 64px;
    }

    .settings-label {
      font-size: 26px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: -0.02em;
    }

    .divider {
      height: 5px;
      border-radius: 999px;
      background: var(--orange-deep);
      margin: 0 12px;
    }

    .chevron {
      font-size: 48px;
      line-height: 0.8;
      color: #111;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      flex: 0 0 auto;
    }

    .switch {
      position: relative;
      width: 68px;
      height: 36px;
      flex: 0 0 auto;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      inset: 0;
      cursor: pointer;
      background: #e2dfdb;
      border-radius: 999px;
      transition: background 0.2s ease;
    }

    .slider::before {
      content: "";
      position: absolute;
      width: 28px;
      height: 28px;
      left: 4px;
      top: 4px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.14);
      transition: transform 0.2s ease;
    }

    .switch input:checked + .slider {
      background: var(--mint);
    }

    .switch input:checked + .slider::before {
      transform: translateX(32px);
    }

    .logout-link {
      color: inherit;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      width: 100%;
    }

    @media (max-width: 560px) {
      body {
        padding: 10px;
      }

      .app-frame {
        width: 100%;
        min-height: auto;
      }

      .profile-title {
        font-size: 56px;
      }

      .avatar-wrap {
        width: 126px;
        height: 126px;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <div class="app-frame">
      <header class="top-bar">
        <a href="home.html" class="home-link">
          <img src="CapyPal-Adhd-app_capy_icon.png" alt="CapyPal home">
          <span>Home</span>
        </a>
      </header>

      <main class="content">
        <h1 class="profile-title">PROFILE</h1>

        <div class="avatar-wrap" aria-label="Profile picture">
          <div class="camera-badge">◉</div>
        </div>

        <section class="settings-card" aria-label="Profile settings">
          <div class="settings-row">
            <div class="settings-label">Account Settings</div>
            <a href="home.html" class="chevron" aria-label="Open account settings">›</a>
          </div>

          <div class="divider"></div>

          <div class="settings-row">
            <div class="settings-label">Notifications</div>
            <label class="switch" aria-label="Notifications">
              <input type="checkbox" checked>
              <span class="slider"></span>
            </label>
          </div>

          <div class="divider"></div>

          <div class="settings-row">
            <div class="settings-label">Lock Screen</div>
            <label class="switch" aria-label="Lock screen">
              <input type="checkbox" checked>
              <span class="slider"></span>
            </label>
          </div>

          <div class="divider"></div>

          <div class="settings-row">
            <a href="index.html" class="logout-link">
              <span class="settings-label">Log Out</span>
              <span class="chevron" aria-hidden="true">›</span>
            </a>
          </div>
        </section>
      </main>

      <footer class="bottom-bar"></footer>
    </div>
  </div>
</body>
</html>
