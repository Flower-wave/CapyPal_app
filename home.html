<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CapyPal — Home</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="app-shell">
      <div class="app-frame">
        <header class="header_home">
          <div class="left">
            <img src="CapyPal-Adhd-app_capy_icon.png" alt="capy" class="app-icon">
            <div class="title">Home</div>
          </div>
          <a href="profile.html" class="right">
            <img src="account_circle.png" alt="profile" class="avatar"> Profile
          </a>
        </header>

        <nav class="top-nav">
          <button class="nav-item nav-home">Home</button>
          <a href="profile.html" class="nav-item nav-profile">Profile</a>
        </nav>

        <main class="home-main">
          <section class="actions-grid">
            <a href="games.html" class="action-btn">
              <img src="games_button.png" alt="games">
              <div class="btn-label">Games</div>
            </a>
            <a href="plan.html" class="action-btn">
              <img src="plan_button.png" alt="plan">
              <div class="btn-label">Plan</div>
            </a>
            <a href="studyspaces.html" class="action-btn">
              <img src="study_button.png" alt="study spaces">
              <div class="btn-label">Study Spaces</div>
            </a>
            <a href="music.html" class="action-btn">
              <img src="music_button.png" alt="music">
              <div class="btn-label">Music</div>
            </a>
          </section>

          <section class="checkon card">
            <div class="checkon-inner">
              <div class="capy-status-note">
                  Your focus looks steady today.
                </div>
              <img src="capy_checkon.png" alt="capy" class="checkon-img">
              <div class="checkon-content">
                <a href="checkoncapy.html" class="btn primary">Check on Capy</a>
              </div>
            </div>
          </section>
        </main>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
