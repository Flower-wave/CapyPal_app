<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CapyPal — Check on Capy</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="app-shell">
      <div class="app-frame">
        <header class="header_home">
          <div class="left">
            <img src="CapyPal-Adhd-app_capy_icon.png" alt="capy" class="app-icon">
            <div class="title">Check on Capy</div>
          </div>
          <div class="right">Profile</div>
        </header>

        <nav class="top-nav">
          <a href="home.html" class="nav-item nav-home">Home</a>
          <button class="nav-item nav-profile">Profile</button>
        </nav>

        <main class="home-main">
          <section class="checkon card">
            <div class="checkon-inner">
              <img src="CapyPal-Adhd-app_meet-capy.png" alt="meet capy" class="checkon-img meet-img">
               <img src="cappy_cabybara.png" alt="capy" class="checkon-img secondary-img">
              <div class="checkon-content">
                <div style="margin-top:12px;display:flex;gap:5px;align-items:center;">
                  <a href="show progress.html" class="btn primary">Show Progress</a>
                  <a href="checkin.html" class="btn primary">Check In</a>
                </div>
              </div>
            </div>
          </section>
        </main>
      </div>
    </div>
  </body>
</html>
