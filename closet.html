<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CapyPal — Closet</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <div class="app-frame">
      <header class="header_home">
        <div class="left">
          <img src="CapyPal-Adhd-app_capy_icon.png" alt="capy" class="app-icon">
          <div class="title">Closet</div>
        </div>
        <div class="right">
          <a href="show progress.html" class="btn back-btn"><span class="back-arrow">←</span>Back</a>
        </div>
      </header>

      <main class="home-main closet-main">
        <section class="closet-card">
          <div class="closet-header">
            <div>
              <div class="page-title">Dress Capy</div>
              <p class="page-sub">Choose items to make Capy feel ready for action.</p>
            </div>
            <img src="cappy_cabybara.png" alt="Capy" class="closet-avatar">
          </div>

          <div class="closet-grid">
            <div class="closet-item">
              <img src="orangehat.png" alt="Orange Hat">
              <strong>Orange Hat</strong>
              <small>Unlocks at 60% HP.</small>
            </div>
            <div class="closet-item">
              <img src="sunglasses.png" alt="Sunglasses">
              <strong>Sunglasses</strong>
              <small>Unlocks at 30% HP.</small>
            </div>
            <div class="closet-item">
              <img src="hoodie_outfit.png" alt="Hoodie Outfit">
              <strong>Hoodie Outfit</strong>
              <small>Unlocks at 80% HP.</small>
            </div>
            <div class="closet-item">
              <img src="boba.png" alt="Boba">
              <strong>Boba</strong>
              <small>Unlocks at 40% HP.</small>
            </div>
            <div class="closet-item">
              <img src="japaneseoutfit.png" alt="Japanese Outfit">
              <strong>Japanese Outfit</strong>
              <small>Unlocks at 100% HP.</small>
            </div>
          </div>
        </section>
      </main>
    </div>
  </div>
</body>
</html>
